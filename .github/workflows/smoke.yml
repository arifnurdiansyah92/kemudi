name: smoke

# Builds the Kemudi images from this commit, starts the production stack
# (infra/docker-compose.yml, without the experimental awak profile) with
# freshly generated secrets, and runs scripts/smoke-test.sh against it:
# superuser, sign-in, API, Kemudi AI health, web UI, closed routes.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  # docker compose reads these, so every step below is plain `docker compose`.
  COMPOSE_PROJECT_NAME: kemudi-smoke
  COMPOSE_FILE: infra/docker-compose.yml:infra/docker-compose.build.yml
  KEMUDI_HTTP_PORT: '9200'

jobs:
  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # No submodules: services/awak (Hermes) is only built for the awak profile.
      - uses: actions/checkout@v4

      - name: Generate env file
        env:
          KEMUDI_VERSION: smoke
          KEMUDI_DOMAIN: 127.0.0.1:9200
          KEMUDI_SCHEME: http
          KEMUDI_BIND: 127.0.0.1
          SESSION_COOKIE_SECURE: 'False'
          CSRF_COOKIE_SECURE: 'False'
          EMAIL_HOST: localhost
          DEFAULT_FROM_EMAIL: kemudi@example.invalid
          EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
        run: |
          sh scripts/init-secrets.sh "$RUNNER_TEMP/kemudi.env"
          echo "COMPOSE_ENV_FILES=$RUNNER_TEMP/kemudi.env" >> "$GITHUB_ENV"

      - name: Compose refuses an empty secret
        run: |
          sed 's/^SECRET_KEY=.*/SECRET_KEY=/' "$RUNNER_TEMP/kemudi.env" > "$RUNNER_TEMP/bad.env"
          if docker compose -f infra/docker-compose.yml --env-file "$RUNNER_TEMP/bad.env" config -q; then
            echo "compose accepted an empty SECRET_KEY" >&2; exit 1
          fi

      - name: Build images
        run: docker compose build

      - name: Start the stack and wait for every healthcheck
        run: docker compose up -d --wait --wait-timeout 600

      - name: Smoke test
        run: sh scripts/smoke-test.sh "http://127.0.0.1:$KEMUDI_HTTP_PORT"

      - name: Logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
