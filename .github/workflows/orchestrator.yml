name: orchestrator

on:
  push:
    branches: [main]
    paths: ['apps/orchestrator/**', '.github/workflows/orchestrator.yml']
  pull_request:
    paths: ['apps/orchestrator/**', '.github/workflows/orchestrator.yml']

defaults:
  run:
    working-directory: apps/orchestrator

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.7'
      - run: uv sync --frozen
      - run: uv run pytest -q
