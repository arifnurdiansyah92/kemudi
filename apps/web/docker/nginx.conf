# Serves the built SPA. The gateway in front routes /api, /media and /events
# to the backend services; everything else lands here.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Hashed build assets never change: cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes fall back to index.html, which must not be cached
    # so a new deploy is picked up on the next load.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
