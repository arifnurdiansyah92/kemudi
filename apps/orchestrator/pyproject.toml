[project]
name = "kemudi-ai"
version = "0.1.0"
description = "Kemudi AI service: contract baseline, CR classification, backtests"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "sqlalchemy>=2.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "pypdf>=5.1",
  "python-docx>=1.1",
  "cryptography>=43",
  "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kemudi_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
