server {
    listen 80 default_server;

    client_max_body_size 100M;
    charset utf-8;

    # Frontend: the Kemudi web UI (apps/web)
    location / {
        proxy_pass http://kemudi-web/;
        proxy_pass_header Server;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $scheme;
    }

    # Kemudi AI (apps/orchestrator). Long timeouts: drafting a baseline is one
    # model call over the whole contract.
    location /api/kemudi/ {
        proxy_pass http://kemudi-orchestrator:8700/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $scheme;
        proxy_read_timeout 300s;
    }

    # Skill uploads: the archive is capped at 4 MiB (skills.MAX_UPLOAD_BYTES),
    # so the gateway refuses anything over 5 MB before buffering it. Same
    # proxy settings as /api/kemudi/ above; the request stays buffered, so the
    # orchestrator always gets a Content-Length (it checks auth, then that).
    location = /api/kemudi/skills/upload {
        client_max_body_size 5m;
        proxy_pass http://kemudi-orchestrator:8700/skills/upload;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $scheme;
        proxy_read_timeout 300s;
    }

    # The orchestrator's model proxy is for kemudi-awak on kemudi-sandbox only.
    location ^~ /api/kemudi/llm/ {
        return 404;
    }

    # API
    location /api/ {
        proxy_pass http://kemudi-back:8000/api/;
        proxy_pass_header Server;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $scheme;
    }

    # Admin
    location /admin/ {
        proxy_pass http://kemudi-back:8000/admin/;
        proxy_pass_header Server;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $scheme;
    }

    # Static
    location /static/ {
        alias /taiga/static/;
    }

    # Media
    location /_protected/ {
        internal;
        alias /taiga/media/;
        add_header Content-disposition "attachment";
    }

    # Unprotected section
    location /media/exports/ {
        alias /taiga/media/exports/;
        add_header Content-disposition "attachment";
    }

    location /media/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $scheme;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://kemudi-protected:8003/;
        proxy_redirect off;
    }

    # Events
    location /events {
        proxy_pass http://kemudi-events:8888/events;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }
}

# Legacy taiga-front, for screens apps/web does not cover yet. It talks to the
# API on the main port (TAIGA_URL), so only the UI itself is served here.
server {
    listen 81;
    charset utf-8;

    location / {
        proxy_pass http://kemudi-front/;
        proxy_pass_header Server;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $scheme;
    }
}
