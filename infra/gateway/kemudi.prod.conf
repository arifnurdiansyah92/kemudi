# Kemudi gateway — production (infra/docker-compose.yml).
#
# Same routes as the dev gateway (kemudi.conf) without the legacy taiga-front
# server, plus: /admin/ closed, no unsigned /media/exports/, security headers, and a
# /healthz probe for the compose healthcheck.
#
# TLS. The recommended setup terminates TLS in a reverse proxy on the host
# (Caddy, Traefik, nginx, a cloud load balancer) that forwards to
# ${KEMUDI_BIND}:${KEMUDI_HTTP_PORT} and sets X-Forwarded-Proto: https. Set
# KEMUDI_SCHEME=https in infra/.env so Taiga builds https links. This gateway
# passes the proxy's X-Forwarded-Proto on (falling back to its own scheme), so
# the apps see the scheme the browser used. See docs/install.md.
#
# To terminate TLS here instead, use the commented server blocks at the end of
# this file, publish 443 in docker-compose.yml and mount the certificates.

# The scheme the browser used: the TLS proxy's header when there is one.
map $http_x_forwarded_proto $kemudi_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80 default_server;

    client_max_body_size 100M;
    charset utf-8;
    server_tokens off;

    # Security headers, on every response (including errors). nginx does not
    # inherit add_header into a location that sets its own, so locations that
    # add headers repeat these.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The gateway is the one source of these: Django sets its own, and two
    # different X-Frame-Options values make browsers ignore the header.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    # HSTS belongs on the TLS endpoint. Behind a TLS proxy, set it there, or
    # uncomment this once every user reaches Kemudi over https only:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Compose healthcheck (and load balancer probes).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Frontend: the Kemudi web UI (apps/web)
    location / {
        proxy_pass http://kemudi-web/;
        proxy_pass_header Server;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $kemudi_forwarded_proto;
        proxy_set_header X-Forwarded-Proto $kemudi_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Kemudi AI (apps/orchestrator). Long timeouts: drafting a baseline is one
    # model call over the whole contract.
    location /api/kemudi/ {
        proxy_pass http://kemudi-orchestrator:8700/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $kemudi_forwarded_proto;
        proxy_set_header X-Forwarded-Proto $kemudi_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # Skill uploads: the archive is capped at 4 MiB (skills.MAX_UPLOAD_BYTES).
    location = /api/kemudi/skills/upload {
        client_max_body_size 5m;
        proxy_pass http://kemudi-orchestrator:8700/skills/upload;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $kemudi_forwarded_proto;
        proxy_set_header X-Forwarded-Proto $kemudi_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # The orchestrator's model proxy is for kemudi-awak on kemudi-sandbox only.
    location ^~ /api/kemudi/llm/ {
        return 404;
    }

    # API
    location /api/ {
        proxy_pass http://kemudi-back:8000/api/;
        proxy_pass_header Server;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $kemudi_forwarded_proto;
        proxy_set_header X-Forwarded-Proto $kemudi_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Django admin: closed in production. Use manage.py from the host
    # (docker compose ... exec kemudi-back python manage.py ...) instead.
    # To open it to an operator network only, replace the return with:
    #
    #   allow 10.0.0.0/8;        # your VPN / office range
    #   deny  all;
    #   proxy_pass http://kemudi-back:8000/admin/;
    #   proxy_set_header Host $http_host;
    #   proxy_set_header X-Real-IP $remote_addr;
    #   proxy_set_header X-Scheme $kemudi_forwarded_proto;
    #
    # Behind a TLS proxy, $remote_addr is the proxy: restore the client address
    # first with set_real_ip_from <proxy address>; real_ip_header X-Forwarded-For;
    location ^~ /admin/ {
        return 404;
    }

    # Static
    location /static/ {
        alias /taiga/static/;
    }

    # Media, served after kemudi-protected checks the signed URL.
    location /_protected/ {
        internal;
        alias /taiga/media/;
        add_header Content-disposition "attachment";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # No unprotected /media/exports/ alias (stock Taiga serves exports there
    # without checking the token, so anyone with the URL downloads a whole
    # project). Exports fall through to /media/ below like every other file:
    # kemudi-protected checks the signed token, which is valid for MAX_AGE
    # (360 s) after issue, so download an export soon after its email arrives
    # (or raise MAX_AGE in docker-compose.yml).

    location /media/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $kemudi_forwarded_proto;
        proxy_set_header X-Forwarded-Proto $kemudi_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://kemudi-protected:8003/;
        proxy_redirect off;
    }

    # Events
    location /events {
        proxy_pass http://kemudi-events:8888/events;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }
}

