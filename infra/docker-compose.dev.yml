# Kemudi — development stack.
#
#   cp infra/.env.example infra/.env
#   docker compose -f infra/docker-compose.dev.yml --env-file infra/.env up -d --build
#   docker compose -f infra/docker-compose.dev.yml --env-file infra/.env exec kemudi-back \
#       python manage.py createsuperuser
#
# Open http://localhost:${KEMUDI_PORT:-9100}
#
# kemudi-back, kemudi-events and kemudi-web (apps/web) are built from source.
# The stock taiga-front stays on http://localhost:${KEMUDI_LEGACY_PORT:-9101}
# for screens apps/web does not have yet.

name: kemudi-dev

x-back-environment: &back-environment
  POSTGRES_DB: "taiga"
  POSTGRES_USER: "${POSTGRES_USER}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
  POSTGRES_HOST: "kemudi-db"
  TAIGA_SECRET_KEY: "${SECRET_KEY}"
  TAIGA_SITES_SCHEME: "${KEMUDI_SCHEME}"
  TAIGA_SITES_DOMAIN: "${KEMUDI_DOMAIN}"
  TAIGA_SUBPATH: ""
  EMAIL_BACKEND: "django.core.mail.backends.console.EmailBackend"
  DEFAULT_FROM_EMAIL: "kemudi@localhost"
  RABBITMQ_USER: "${RABBITMQ_USER}"
  RABBITMQ_PASS: "${RABBITMQ_PASS}"
  TAIGA_EVENTS_RABBITMQ_HOST: "kemudi-events-rabbitmq"
  TAIGA_ASYNC_RABBITMQ_HOST: "kemudi-async-rabbitmq"
  ENABLE_TELEMETRY: "False"

x-back-volumes: &back-volumes
  - kemudi-static-data:/taiga-back/static
  - kemudi-media-data:/taiga-back/media

x-rabbitmq: &rabbitmq
  image: rabbitmq:3.8-management-alpine
  environment:
    RABBITMQ_ERLANG_COOKIE: "${RABBITMQ_ERLANG_COOKIE}"
    RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
    RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS}"
    RABBITMQ_DEFAULT_VHOST: "taiga"
  healthcheck:
    test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
    interval: 5s
    timeout: 10s
    retries: 10
    start_period: 30s

services:
  kemudi-db:
    image: postgres:12.3
    environment:
      POSTGRES_DB: "taiga"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 2s
      timeout: 15s
      retries: 5
    volumes:
      - kemudi-db-data:/var/lib/postgresql/data

  kemudi-back:
    build:
      context: ../services/kemudi-back
      dockerfile: docker/Dockerfile
    image: kemudi/kemudi-back:dev
    environment: *back-environment
    volumes: *back-volumes
    depends_on:
      kemudi-db: { condition: service_healthy }
      kemudi-events-rabbitmq: { condition: service_healthy }
      kemudi-async-rabbitmq: { condition: service_healthy }

  kemudi-async:
    image: kemudi/kemudi-back:dev
    entrypoint: ["/taiga-back/docker/async_entrypoint.sh"]
    environment: *back-environment
    volumes: *back-volumes
    restart: unless-stopped
    depends_on:
      kemudi-back: { condition: service_started }

  kemudi-async-rabbitmq:
    <<: *rabbitmq
    hostname: kemudi-async-rabbitmq
    volumes:
      - kemudi-async-rabbitmq-data:/var/lib/rabbitmq

  kemudi-events:
    build:
      context: ../services/kemudi-events
      dockerfile: docker/Dockerfile
    image: kemudi/kemudi-events:dev
    environment:
      RABBITMQ_USER: "${RABBITMQ_USER}"
      RABBITMQ_PASS: "${RABBITMQ_PASS}"
      TAIGA_SECRET_KEY: "${SECRET_KEY}"
      TAIGA_EVENTS_RABBITMQ_HOST: "kemudi-events-rabbitmq"
    restart: unless-stopped
    depends_on:
      kemudi-events-rabbitmq: { condition: service_healthy }

  kemudi-events-rabbitmq:
    <<: *rabbitmq
    hostname: kemudi-events-rabbitmq
    volumes:
      - kemudi-events-rabbitmq-data:/var/lib/rabbitmq

  kemudi-protected:
    image: taigaio/taiga-protected:latest
    environment:
      MAX_AGE: "360"
      SECRET_KEY: "${SECRET_KEY}"

  kemudi-web:
    build:
      context: ../apps/web
    image: kemudi/kemudi-web:dev

  # Kemudi AI: Hermes (services/awak) as an OpenAI-compatible API server with
  # every tool off. Config: infra/hermes/config.yaml (managed scope, read-only).
  # In compose: ${KEMUDI_HERMES_URL} (http://kemudi-hermes:8642/v1).
  # From the host: http://127.0.0.1:8642/v1. Bearer ${KEMUDI_HERMES_API_KEY}.
  kemudi-hermes:
    build:
      context: ../services/awak
    image: kemudi/kemudi-hermes:dev
    command: ["gateway", "run"]
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: "${KEMUDI_HERMES_API_KEY}"
      API_SERVER_MODEL_NAME: "kemudi-hermes"
      KEMUDI_AI_BASE_URL: "${KEMUDI_AI_BASE_URL}"
      KEMUDI_AI_API_KEY: "${KEMUDI_AI_API_KEY}"
      KEMUDI_AI_MODEL: "${KEMUDI_AI_MODEL}"
    volumes:
      - ./hermes/config.yaml:/etc/hermes/config.yaml:ro
      # Named volume, not a bind mount: SQLite WAL is unsafe over Docker
      # Desktop's Windows file sharing (website/docs/user-guide/docker.md).
      - kemudi-hermes-data:/opt/data
    ports:
      - "127.0.0.1:8642:8642"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8642/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # Kemudi AI service (apps/orchestrator): contract baseline, CR check,
  # backtests. Served at /api/kemudi/ by the gateway; every model call goes
  # through kemudi-hermes.
  kemudi-orchestrator:
    build:
      context: ../apps/orchestrator
    image: kemudi/kemudi-orchestrator:dev
    environment:
      KEMUDI_HERMES_URL: "${KEMUDI_HERMES_URL}"
      KEMUDI_HERMES_API_KEY: "${KEMUDI_HERMES_API_KEY}"
      KEMUDI_AI_MODEL: "${KEMUDI_AI_MODEL}"
      KEMUDI_AI_DB_URL: "sqlite:////var/lib/kemudi-ai/kemudi-ai.db"
      KEMUDI_TAIGA_API_URL: "http://kemudi-back:8000/api/v1"
      # Awak dev loop; empty KEMUDI_AWAK_PROJECTS keeps the worker off.
      KEMUDI_AWAK_PROJECTS: "${KEMUDI_AWAK_PROJECTS:-}"
      KEMUDI_AWAK_PASSWORD: "${KEMUDI_AWAK_PASSWORD:-}"
      KEMUDI_QA_PASSWORD: "${KEMUDI_QA_PASSWORD:-}"
      KEMUDI_AWAK_API_KEY: "${KEMUDI_AWAK_API_KEY:-}"
      KEMUDI_AWAK_MODEL: "${KEMUDI_AWAK_MODEL:-deepseek-flash}"
      KEMUDI_QA_MODEL: "${KEMUDI_QA_MODEL:-deepseek-flash}"
      KEMUDI_RUNNER_KEY: "${KEMUDI_RUNNER_KEY:-}"
      KEMUDI_SVC_KEY: "${KEMUDI_SVC_KEY:-}"
      # Fernet key that encrypts the SSH keys Kemudi generates (Project
      # settings -> Agent). Empty = key generation answers 503.
      KEMUDI_SECRET_KEY: "${KEMUDI_SECRET_KEY:-}"
      # The server-default model connection. The orchestrator is Awak's model
      # proxy (/llm/v1, on kemudi-sandbox; egress through default) and adds the
      # key, a project's or agent's own (BYOK) or this one. The secret scanner
      # also looks for this value in Awak's diffs and comments.
      KEMUDI_AI_BASE_URL: "${KEMUDI_AI_BASE_URL}"
      KEMUDI_AI_API_KEY: "${KEMUDI_AI_API_KEY}"
      # Shared token kemudi-awak sends to /llm/v1 (infra/awak/config.yaml).
      KEMUDI_LLM_PROXY_TOKEN: "${KEMUDI_LLM_PROXY_TOKEN:-}"
      # Kemudi instance admins (the skill library): Taiga user ids,
      # comma-separated; usernames are a fallback (infra/.env.example).
      KEMUDI_ADMIN_USER_IDS: "${KEMUDI_ADMIN_USER_IDS:-}"
      KEMUDI_ADMIN_USERNAMES: "${KEMUDI_ADMIN_USERNAMES:-}"
    volumes:
      # Contracts are confidential: a named volume, never the repo.
      - kemudi-ai-data:/var/lib/kemudi-ai
      - kemudi-awak-workspace:/workspace
      # Only the repo's git data: Awak's branches are pushed here as awak/us-<n>.
      - ../.git:/host-git
      # Awak skill sets and their Hermes profiles: written here, served by
      # kemudi-awak (docs/superpowers/specs/2026-11-14-awak-skills-design.md).
      - kemudi-awak-skills:/opt/skills
      - kemudi-awak-profiles:/opt/awak-profiles
      # Repos kemudi-runner fetched for the skill marketplace (read only here).
      - kemudi-skills-fetch:/var/lib/kemudi-ai/skills-fetch:ro
    # kemudi-svcnet: the only way to kemudi-svc (and so to the sandboxed Docker).
    networks: [default, kemudi-sandbox, kemudi-svcnet]
    restart: unless-stopped
    depends_on:
      kemudi-back: { condition: service_started }
      kemudi-hermes: { condition: service_healthy }

  # --- Awak dev loop (profile "awak") -------------------------------------
  # docs/superpowers/specs/2026-11-13-awak-dev-loop-design.md
  # kemudi-sandbox is internal (no internet). Awak holds no provider key: it
  # reaches the model through the orchestrator's /llm/v1 proxy, which maps the
  # run's alias to the real model and key.
  kemudi-awak:
    image: kemudi/kemudi-hermes:dev
    profiles: [awak]
    command: ["gateway", "run"]
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: "${KEMUDI_AWAK_API_KEY:-}"
      API_SERVER_MODEL_NAME: "kemudi-awak"
      KEMUDI_AWAK_MODEL: "${KEMUDI_AWAK_MODEL:-deepseek-flash}"
      # Only admits Awak to the orchestrator's model proxy; not a provider key.
      KEMUDI_LLM_PROXY_TOKEN: "${KEMUDI_LLM_PROXY_TOKEN:-unset}"
      # The image limits Hermes' file tools to /opt/data; Awak's checkouts live
      # in /workspace. Without this, models that respect the tool limit (e.g.
      # Claude) cannot edit any file and every attempt ends without a commit.
      # Only /workspace: the file tools never need Hermes' own home.
      HERMES_WRITE_SAFE_ROOT: "/workspace"
      # Every run goes through /p/sk-<setid>/: a profile per skill set, written
      # by the orchestrator (kemudi_ai/awak/skills.py). Read at boot; a new
      # profile is served at Hermes' next watcher pass (30 s), no restart.
      GATEWAY_MULTIPLEX_PROFILES: "true"
    volumes:
      - ./awak/config.yaml:/etc/hermes/config.yaml:ro
      - kemudi-awak-data:/opt/data
      - kemudi-awak-workspace:/workspace
      # Skill files (read-only here) and the per-set profiles.
      - kemudi-awak-skills:/opt/skills:ro
      - kemudi-awak-profiles:/opt/data/profiles
    networks: [kemudi-sandbox]
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER, KILL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    pids_limit: 512
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8642/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # Runs branch code (pnpm install, gates, Playwright). No secrets; it has
  # internet for npm only through kemudi-egress.
  kemudi-runner:
    build:
      context: ./runner
    image: kemudi/kemudi-runner:dev
    profiles: [awak]
    # tini as PID 1 reaps the grandchildren of stopped process services
    # (a dev server's workers), which the Python server would leave defunct.
    init: true
    environment:
      KEMUDI_RUNNER_KEY: "${KEMUDI_RUNNER_KEY:-}"
      KEMUDI_DEV_GATEWAY: "http://kemudi-gateway"
    volumes:
      - kemudi-awak-workspace:/workspace
      - kemudi-pnpm-store:/pnpm-store
      # Marketplace fetches (uid 10001; fetch.py): never the workspace, which
      # project code and Hermes write. Only this service and the orchestrator
      # (read-only) mount it.
      - kemudi-skills-fetch:/skills-fetch
    # kemudi-dindnet: published ports of compose services (http://kemudi-dind:<port>).
    networks: [kemudi-sandbox, kemudi-egress, kemudi-dindnet]
    # The server runs as root only to drop each child to uid 10000
    # (SETUID/SETGID) and to stop their process groups (KILL).
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 4g
    pids_limit: 1024
    restart: unless-stopped

  # Sandboxed Docker for a project's compose services (QA, `run_in` gates).
  # Listens only on a unix socket in kemudi-dind-sock, which only kemudi-svc
  # mounts: branch code (kemudi-runner, kemudi-awak) never reaches the daemon.
  # Not on kemudi-sandbox: kemudi-dindnet (internal, shared with the runner,
  # which reaches published ports at http://kemudi-dind:<port>) plus
  # kemudi-egress for image pulls and package installs during builds.
  # docs/superpowers/specs/2026-11-14-awak-workspace-runbook-design.md
  kemudi-dind:
    image: docker:27-dind
    profiles: [awak]
    privileged: true
    command: ["dockerd", "--host=unix:///run/dind/docker.sock", "--userns-remap=default",
              "--default-address-pool", "base=10.201.0.0/16,size=24"]
    environment:
      # No TLS certs and no TCP listener: the socket is the only way in.
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - kemudi-dind-sock:/run/dind
      - kemudi-dind-data:/var/lib/docker
    networks: [kemudi-dindnet, kemudi-egress]
    mem_limit: 5g
    pids_limit: 2048
    restart: unless-stopped

  # The only client of kemudi-dind (infra/svc/svc.py): sanitizes a project's
  # compose file and runs the normalized copy. Never runs branch code itself.
  # Reachable only from the orchestrator (kemudi-svcnet), with its own key.
  kemudi-svc:
    build:
      context: ./svc
    image: kemudi/kemudi-svc:dev
    profiles: [awak]
    init: true
    environment:
      KEMUDI_SVC_KEY: "${KEMUDI_SVC_KEY:-}"
      DOCKER_HOST: "unix:///run/dind/docker.sock"
    volumes:
      - kemudi-dind-sock:/run/dind
      - kemudi-awak-workspace:/workspace:ro
    # Vault env files and normalized compose files; never on disk.
    tmpfs:
      - /run/svc:mode=0700
    networks: [kemudi-svcnet]
    # Root with SETUID/SETGID (compose files are first read as uid 10000),
    # KILL (stop that child on a deadline), DAC_READ_SEARCH (build contexts
    # owned by 10000).
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL, DAC_READ_SEARCH]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 512
    depends_on:
      - kemudi-dind
    restart: unless-stopped

  # Legacy UI, for screens apps/web does not cover yet. Remove once it does.
  kemudi-front:
    image: taigaio/taiga-front:latest
    environment:
      TAIGA_URL: "${KEMUDI_SCHEME}://${KEMUDI_DOMAIN}"
      TAIGA_WEBSOCKETS_URL: "${KEMUDI_WS_SCHEME}://${KEMUDI_DOMAIN}"
      TAIGA_SUBPATH: ""

  kemudi-gateway:
    image: nginx:1.19-alpine
    ports:
      - "${KEMUDI_PORT:-9100}:80"
      - "${KEMUDI_LEGACY_PORT:-9101}:81"
    volumes:
      - ./gateway/kemudi.conf:/etc/nginx/conf.d/default.conf:ro
      - kemudi-static-data:/taiga/static
      - kemudi-media-data:/taiga/media
    # On kemudi-sandbox so QA runs reach the app the way a browser would.
    networks: [default, kemudi-sandbox]
    depends_on:
      - kemudi-web
      - kemudi-front
      - kemudi-back
      - kemudi-events
      - kemudi-orchestrator

volumes:
  kemudi-static-data:
  kemudi-media-data:
  kemudi-db-data:
  kemudi-async-rabbitmq-data:
  kemudi-events-rabbitmq-data:
  kemudi-hermes-data:
  kemudi-ai-data:
  kemudi-awak-data:
  kemudi-awak-workspace:
  kemudi-awak-skills:
  kemudi-awak-profiles:
  kemudi-skills-fetch:
  kemudi-pnpm-store:
  kemudi-dind-sock:
  kemudi-dind-data:

networks:
  default: {}
  kemudi-sandbox:
    internal: true
  kemudi-egress: {}
  # kemudi-runner <-> kemudi-dind (published ports of compose services).
  kemudi-dindnet:
    internal: true
  # kemudi-orchestrator <-> kemudi-svc.
  kemudi-svcnet:
    internal: true
