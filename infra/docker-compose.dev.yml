# Kemudi — development stack.
#
#   cp infra/.env.example infra/.env
#   docker compose -f infra/docker-compose.dev.yml --env-file infra/.env up -d --build
#   docker compose -f infra/docker-compose.dev.yml --env-file infra/.env exec kemudi-back \
#       python manage.py createsuperuser
#
# Open http://localhost:${KEMUDI_PORT:-9100}
#
# kemudi-back, kemudi-events and kemudi-web (apps/web) are built from source.
# The stock taiga-front stays on http://localhost:${KEMUDI_LEGACY_PORT:-9101}
# for screens apps/web does not have yet.

name: kemudi-dev

x-back-environment: &back-environment
  POSTGRES_DB: "taiga"
  POSTGRES_USER: "${POSTGRES_USER}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
  POSTGRES_HOST: "kemudi-db"
  TAIGA_SECRET_KEY: "${SECRET_KEY}"
  TAIGA_SITES_SCHEME: "${KEMUDI_SCHEME}"
  TAIGA_SITES_DOMAIN: "${KEMUDI_DOMAIN}"
  TAIGA_SUBPATH: ""
  EMAIL_BACKEND: "django.core.mail.backends.console.EmailBackend"
  DEFAULT_FROM_EMAIL: "kemudi@localhost"
  RABBITMQ_USER: "${RABBITMQ_USER}"
  RABBITMQ_PASS: "${RABBITMQ_PASS}"
  TAIGA_EVENTS_RABBITMQ_HOST: "kemudi-events-rabbitmq"
  TAIGA_ASYNC_RABBITMQ_HOST: "kemudi-async-rabbitmq"
  ENABLE_TELEMETRY: "False"

x-back-volumes: &back-volumes
  - kemudi-static-data:/taiga-back/static
  - kemudi-media-data:/taiga-back/media

x-rabbitmq: &rabbitmq
  image: rabbitmq:3.8-management-alpine
  environment:
    RABBITMQ_ERLANG_COOKIE: "${RABBITMQ_ERLANG_COOKIE}"
    RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
    RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS}"
    RABBITMQ_DEFAULT_VHOST: "taiga"
  healthcheck:
    test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
    interval: 5s
    timeout: 10s
    retries: 10
    start_period: 30s

services:
  kemudi-db:
    image: postgres:12.3
    environment:
      POSTGRES_DB: "taiga"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 2s
      timeout: 15s
      retries: 5
    volumes:
      - kemudi-db-data:/var/lib/postgresql/data

  kemudi-back:
    build:
      context: ../services/kemudi-back
      dockerfile: docker/Dockerfile
    image: kemudi/kemudi-back:dev
    environment: *back-environment
    volumes: *back-volumes
    depends_on:
      kemudi-db: { condition: service_healthy }
      kemudi-events-rabbitmq: { condition: service_healthy }
      kemudi-async-rabbitmq: { condition: service_healthy }

  kemudi-async:
    image: kemudi/kemudi-back:dev
    entrypoint: ["/taiga-back/docker/async_entrypoint.sh"]
    environment: *back-environment
    volumes: *back-volumes
    restart: unless-stopped
    depends_on:
      kemudi-back: { condition: service_started }

  kemudi-async-rabbitmq:
    <<: *rabbitmq
    hostname: kemudi-async-rabbitmq
    volumes:
      - kemudi-async-rabbitmq-data:/var/lib/rabbitmq

  kemudi-events:
    build:
      context: ../services/kemudi-events
      dockerfile: docker/Dockerfile
    image: kemudi/kemudi-events:dev
    environment:
      RABBITMQ_USER: "${RABBITMQ_USER}"
      RABBITMQ_PASS: "${RABBITMQ_PASS}"
      TAIGA_SECRET_KEY: "${SECRET_KEY}"
      TAIGA_EVENTS_RABBITMQ_HOST: "kemudi-events-rabbitmq"
    restart: unless-stopped
    depends_on:
      kemudi-events-rabbitmq: { condition: service_healthy }

  kemudi-events-rabbitmq:
    <<: *rabbitmq
    hostname: kemudi-events-rabbitmq
    volumes:
      - kemudi-events-rabbitmq-data:/var/lib/rabbitmq

  kemudi-protected:
    image: taigaio/taiga-protected:latest
    environment:
      MAX_AGE: "360"
      SECRET_KEY: "${SECRET_KEY}"

  kemudi-web:
    build:
      context: ../apps/web
    image: kemudi/kemudi-web:dev

  # Kemudi AI: Hermes (services/awak) as an OpenAI-compatible API server with
  # every tool off. Config: infra/hermes/config.yaml (managed scope, read-only).
  # In compose: ${KEMUDI_HERMES_URL} (http://kemudi-hermes:8642/v1).
  # From the host: http://127.0.0.1:8642/v1. Bearer ${KEMUDI_HERMES_API_KEY}.
  kemudi-hermes:
    build:
      context: ../services/awak
    image: kemudi/kemudi-hermes:dev
    command: ["gateway", "run"]
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: "${KEMUDI_HERMES_API_KEY}"
      API_SERVER_MODEL_NAME: "kemudi-hermes"
      KEMUDI_AI_BASE_URL: "${KEMUDI_AI_BASE_URL}"
      KEMUDI_AI_API_KEY: "${KEMUDI_AI_API_KEY}"
      KEMUDI_AI_MODEL: "${KEMUDI_AI_MODEL}"
    volumes:
      - ./hermes/config.yaml:/etc/hermes/config.yaml:ro
      # Named volume, not a bind mount: SQLite WAL is unsafe over Docker
      # Desktop's Windows file sharing (website/docs/user-guide/docker.md).
      - kemudi-hermes-data:/opt/data
    ports:
      - "127.0.0.1:8642:8642"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8642/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # Kemudi AI service (apps/orchestrator): contract baseline, CR check,
  # backtests. Served at /api/kemudi/ by the gateway; every model call goes
  # through kemudi-hermes.
  kemudi-orchestrator:
    build:
      context: ../apps/orchestrator
    image: kemudi/kemudi-orchestrator:dev
    environment:
      KEMUDI_HERMES_URL: "${KEMUDI_HERMES_URL}"
      KEMUDI_HERMES_API_KEY: "${KEMUDI_HERMES_API_KEY}"
      KEMUDI_AI_MODEL: "${KEMUDI_AI_MODEL}"
      KEMUDI_AI_DB_URL: "sqlite:////var/lib/kemudi-ai/kemudi-ai.db"
      KEMUDI_TAIGA_API_URL: "http://kemudi-back:8000/api/v1"
    volumes:
      # Contracts are confidential: a named volume, never the repo.
      - kemudi-ai-data:/var/lib/kemudi-ai
    restart: unless-stopped
    depends_on:
      kemudi-back: { condition: service_started }
      kemudi-hermes: { condition: service_healthy }

  # Legacy UI, for screens apps/web does not cover yet. Remove once it does.
  kemudi-front:
    image: taigaio/taiga-front:latest
    environment:
      TAIGA_URL: "${KEMUDI_SCHEME}://${KEMUDI_DOMAIN}"
      TAIGA_WEBSOCKETS_URL: "${KEMUDI_WS_SCHEME}://${KEMUDI_DOMAIN}"
      TAIGA_SUBPATH: ""

  kemudi-gateway:
    image: nginx:1.19-alpine
    ports:
      - "${KEMUDI_PORT:-9100}:80"
      - "${KEMUDI_LEGACY_PORT:-9101}:81"
    volumes:
      - ./gateway/kemudi.conf:/etc/nginx/conf.d/default.conf:ro
      - kemudi-static-data:/taiga/static
      - kemudi-media-data:/taiga/media
    depends_on:
      - kemudi-web
      - kemudi-front
      - kemudi-back
      - kemudi-events
      - kemudi-orchestrator

volumes:
  kemudi-static-data:
  kemudi-media-data:
  kemudi-db-data:
  kemudi-async-rabbitmq-data:
  kemudi-events-rabbitmq-data:
  kemudi-hermes-data:
  kemudi-ai-data:
