# Kemudi: Awak, the coding agent (Hermes with terminal and file tools).
#
# Mounted read-only at /etc/hermes/config.yaml (Hermes' managed scope), so the
# agent cannot change its own settings. No provider key here: the model is
# reached through the orchestrator's internal /llm/v1 proxy. Each run's model
# name is a short-lived alias (awak-run-<hex>) that the orchestrator maps to the
# run's connection (agent > project > server default, BYOK) and the real key.
# api_key is only the proxy's shared token, not a provider key.
# See docs/superpowers/specs/2026-11-14-awak-byok-design.md.

model:
  provider: custom
  base_url: http://kemudi-orchestrator:8700/llm/v1
  api_key: ${KEMUDI_LLM_PROXY_TOKEN}
  # Only a fallback name: the orchestrator sends an alias with every run, and
  # the proxy refuses any other model name.
  default: ${KEMUDI_AWAK_MODEL}

# --- Tools: terminal, file and (read-only) skills ----------------------------
# skills: the role's skill set, served through the run's profile
# (/p/sk-<setid>/, skills.external_dirs). The set volume is read-only and
# skills.write_approval stages any skill_manage write, never applies it.
platform_toolsets:
  api_server: [terminal, file, todo, skills]
toolsets: [terminal, file, todo, skills]
mcp_servers: {}

terminal:
  backend: local
  cwd: /workspace
  timeout: 600

agent:
  max_turns: 80
  run_budget_seconds: 1200
  disabled_toolsets:
    - bot_room
    - browser
    - catalog
    - clarify
    - code_execution
    - computer_use
    - connections
    - context_engine
    - cronjob
    - delegation
    - desktop_ui
    - discord
    - discord_admin
    - feishu_doc
    - feishu_drive
    - image_gen
    - kanban
    - memory
    - onboarding
    - project
    - search
    - session_search
    - stt
    - tts
    - video
    - video_gen
    - vision
    - web
    - x_search

# Unattended: nobody can answer a prompt, and the container is the boundary
# (internal network, no secrets, no Docker socket).
approvals:
  mode: "off"
  unattended_mode: approve
  single_query_mode: approve
  deny:
    - "git push*"
    - "*git remote add*"
    - "git checkout -b*"
    - "git switch*"
    - "git reset --hard*"
    - "git rebase*"
    - "*curl*|*sh*"

security:
  # AGENTS.md/CLAUDE.md stay off limits (default true): refused when unattended.
  protected_instruction_files: true

# --- No memory or background LLM work; skills read-only ----------------------
memory:
  memory_enabled: false
  user_profile_enabled: false
  nudge_interval: 0
  provider: ""

# No skills.auto_load or external_dirs here: lists in this managed overlay
# replace the profile's whole, and each run's profile sets external_dirs.
skills:
  project_discovery: false
  inline_shell: false
  write_approval: true

curator:
  enabled: false

compression:
  enabled: true

checkpoints:
  enabled: false

smart_model_routing:
  enabled: false

auxiliary:
  title_generation:
    enabled: false
    model_upgrade_enabled: false
  background_review:
    enabled: false

plugins:
  enabled: []

model_catalog:
  enabled: false

updates:
  check: false

telemetry:
  shared_metrics:
    enabled: false
    send: false

gateway:
  platforms:
    api_server:
      tool_progress_events: false
